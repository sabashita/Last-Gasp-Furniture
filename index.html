<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="author" content="Haiyang Li">
    <meta name="shopstore" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <title>Bear Ninja Hunter</title>
    <script src="javascript/script.js" defer></script>

</head>

<body>
    <div class="page" id="page">
        <div>
            <button onclick="purchase();">Make a Purchase</button>

        </div>

        <div class="page"  id="page">
            <table id="purchaseList" class="purchaseList">
                <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Price</th>
                </tr>
            </table>

            <hr>
            <table id="summary" class="summary">
                <tr>
                    <td>Item Total:</td>
                    <td id="total"></td>
                </tr>
                <tr>
                    <td id="shippintTitle"></td>
                    <td id="shipping"></td>
                </tr>
                <tr>
                    <td>Subtotal:</td>
                    <td id="subtotal"></td>
                </tr>
                <tr>
                    <td>Tax:</td>
                    <td id="tax"></td>
                </tr>
                <tr>
                    <td>Invoice Total:</td>
                    <td id="invoice"></td>
                </tr>

            </table>
            <button onclick="resetList();">Shop Again</button>
        </div>
    </div>

    
</body>
